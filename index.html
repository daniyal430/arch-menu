<title>Arch View Restaurant & Cafe Menu</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;600;700&family=Nunito:wght@400;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<style>
:root{
  --rust:#9A2E1F; --wine:#7E1A17; --coffee:#C77A1C; --cream:#F6EACE; --cream-2:#EFDFB9;
  --paper:#FBF6EA; --sky:#CFE2EA; --ink:#3A2118; --ink-2:#7A5A4A; --line:#E4D3AE;
  --shadow:0 6px 18px rgba(90,40,20,.12);
  --display:"Josefin Sans","Trebuchet MS",sans-serif; --body:"Nunito","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
*{box-sizing:border-box}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--coffee);outline-offset:2px}
img{max-width:100%;display:block}
.wrap{max-width:960px;margin:0 auto;padding:0 16px 40px}

/* header */
header{background:var(--rust);color:#fff;padding:calc(env(safe-area-inset-top,0px) + 18px) 16px 22px;position:relative;overflow:hidden}
header::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(90deg,var(--coffee) 0 14px,transparent 14px 28px);opacity:.7}
.brand{max-width:960px;margin:0 auto;display:flex;align-items:center;gap:16px}
.brand svg{width:84px;height:84px;flex:none;filter:drop-shadow(0 4px 10px rgba(0,0,0,.25))}
.brand h1{margin:0;font-family:var(--display);font-weight:700;font-size:clamp(20px,4.6vw,30px);letter-spacing:.14em;text-transform:uppercase;line-height:1.05}
.brand p{margin:6px 0 0;font-family:var(--display);letter-spacing:.22em;text-transform:uppercase;font-size:11.5px;opacity:.85}
.brand .ar{font-family:var(--body);letter-spacing:0;font-size:15px;text-transform:none;opacity:.95}

/* search */
.search{margin:18px 0 6px;position:relative}
.search input{width:100%;padding:12px 44px 12px 16px;border-radius:999px;border:1.5px solid var(--line);background:#fff;font:inherit;font-size:15px;color:var(--ink)}
.search input::placeholder{color:#a08a78}
.search svg{position:absolute;right:16px;top:50%;transform:translateY(-50%);width:20px;height:20px;stroke:var(--coffee);fill:none;stroke-width:2.2}

/* meal tabs */
.tabs{display:flex;gap:8px;overflow-x:auto;padding:12px 0 6px;scrollbar-width:none;-ms-overflow-style:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 16px;border-radius:999px;background:#fff;border:1.5px solid var(--line);font-family:var(--display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:7px;transition:.15s}
.tab[aria-selected="true"]{background:var(--rust);border-color:var(--rust);color:#fff}
.tab span.n{font-family:var(--body);font-weight:800;font-size:11px;background:rgba(0,0,0,.08);padding:2px 7px;border-radius:999px}
.tab[aria-selected="true"] span.n{background:rgba(255,255,255,.22)}

h2.sec{font-family:var(--display);text-transform:uppercase;letter-spacing:.16em;font-size:13px;color:var(--rust);margin:22px 0 10px;display:flex;align-items:center;gap:12px}
h2.sec::after{content:"";flex:1;height:1.5px;background:var(--line)}

/* category cards */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.cat{position:relative;border-radius:16px;overflow:hidden;background:var(--cream);box-shadow:var(--shadow);aspect-ratio:1/1;max-width:100%;text-align:left;padding:0;transition:transform .15s}
.cat:hover{transform:translateY(-2px)}
.cat img{width:100%;height:100%;object-fit:cover;object-position:center 40%}
.cat .lbl{position:absolute;left:0;right:0;bottom:0;padding:26px 12px 11px;background:linear-gradient(to top,rgba(70,20,10,.85),rgba(70,20,10,0));color:#fff;font-family:var(--display);font-weight:600;letter-spacing:.06em;text-transform:uppercase;font-size:13.5px;line-height:1.2}
.cat .lbl small{display:block;font-family:var(--body);font-weight:600;letter-spacing:0;text-transform:none;font-size:11.5px;opacity:.8;margin-top:2px}

/* items view */
.topbar{display:flex;align-items:center;gap:10px;margin:16px 0 4px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--paper);padding:10px 0;z-index:5}
.back{width:42px;height:42px;border-radius:50%;background:#fff;border:1.5px solid var(--line);display:grid;place-items:center;flex:none}
.back svg{width:20px;height:20px;stroke:var(--rust);fill:none;stroke-width:2.4}
.topbar h2{margin:0;font-family:var(--display);text-transform:uppercase;letter-spacing:.1em;font-size:18px;color:var(--rust);line-height:1.1}
.topbar h2 small{display:block;font-family:var(--body);text-transform:none;letter-spacing:0;font-size:12px;color:var(--ink-2);font-weight:600;margin-top:3px}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px;margin-top:10px}
@media(max-width:380px){.items{grid-template-columns:1fr 1fr}}
.item{background:#fff;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);text-align:left;padding:0;display:flex;flex-direction:column;transition:transform .15s}
.item:hover{transform:translateY(-2px)}
.item .ph{background:var(--cream);aspect-ratio:1/1;max-width:100%;display:grid;place-items:center}
.item .ph img{width:100%;height:100%;object-fit:cover}
.item .ph .noimg{font-size:40px;opacity:.55}
.item .txt{padding:10px 12px 12px;display:flex;flex-direction:column;gap:4px;flex:1}
.item .nm{font-weight:800;font-size:14.5px;line-height:1.2;color:var(--ink)}
.item .nm .ar{display:block;font-weight:600;font-size:13px;color:var(--ink-2)}
.item .row{display:flex;justify-content:space-between;align-items:baseline;gap:6px;margin-top:auto;font-variant-numeric:tabular-nums}
.price{color:var(--rust);font-weight:800;font-size:15px;white-space:nowrap}
.price.multi{font-size:11.5px;line-height:1.3;white-space:normal}
.kcal{font-size:11.5px;color:var(--ink-2);font-weight:600;white-space:nowrap}

/* detail sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(40,15,8,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:0}
.sheet{background:var(--paper);width:100%;max-width:560px;border-radius:24px 24px 0 0;max-height:92vh;overflow:auto;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px);animation:up .22s ease-out}
@media(min-width:600px){.sheet-bg{align-items:center;padding:20px}.sheet{border-radius:24px}}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}.cat,.item{transition:none}}
.sheet .ph{background:var(--cream);aspect-ratio:1/1;max-height:60vh;max-width:100%;display:grid;place-items:center}
.sheet .ph img{width:100%;height:100%;object-fit:contain}
.sheet .body{padding:18px 20px 8px}
.sheet h3{margin:0;font-family:var(--display);font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:var(--rust);line-height:1.15;text-wrap:balance}
.sheet .ar{font-size:17px;color:var(--ink-2);font-weight:700;margin:4px 0 0}
.sheet .meta{display:flex;gap:10px;flex-wrap:wrap;margin:14px 0 6px;align-items:center}
.chip{background:var(--cream);color:var(--ink);padding:8px 14px;border-radius:999px;font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.chip.p{background:var(--rust);color:#fff}
.chip.k{font-weight:700;font-size:13px;color:var(--ink-2)}
.sheet .desc{margin:10px 0 0;color:var(--ink-2);font-size:14px}
.sheet .catlink{margin:10px 0 0;font-size:12.5px;color:var(--ink-2);font-weight:600;text-transform:uppercase;letter-spacing:.1em}
.close{position:absolute;top:12px;right:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.9);display:grid;place-items:center;box-shadow:var(--shadow)}
.close svg{width:18px;height:18px;stroke:var(--rust);stroke-width:2.6;fill:none}
.sheet .phwrap{position:relative}

.empty{padding:40px 12px;text-align:center;color:var(--ink-2)}
footer{margin-top:36px;text-align:center;font-size:12px;color:var(--ink-2);font-weight:600}
/* language */
.lang{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px;background:rgba(255,255,255,.14);border:1.5px solid rgba(255,255,255,.55);color:#fff;border-radius:999px;padding:7px 14px;font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.06em;z-index:3}
.lang b{font-family:"Tajawal",var(--body);font-size:15px;letter-spacing:0}
html[dir=rtl] .lang{right:auto;left:16px}
html[dir=rtl] body{font-family:"Tajawal",var(--body)}
html[dir=rtl] .brand h1,html[dir=rtl] .tab,html[dir=rtl] h2.sec,html[dir=rtl] .topbar h2,html[dir=rtl] .cat .lbl,html[dir=rtl] .sheet h3,html[dir=rtl] .sheet .catlink,html[dir=rtl] footer .lg,html[dir=rtl] .brand p{font-family:"Tajawal",var(--body);letter-spacing:0}
html[dir=rtl] .brand h1{font-size:clamp(24px,5.6vw,34px);font-weight:800}
html[dir=rtl] .tab{font-size:14px;font-weight:700}
html[dir=rtl] h2.sec{font-size:15px;font-weight:700}
html[dir=rtl] .topbar h2{font-size:20px;font-weight:800}
html[dir=rtl] .cat .lbl{font-size:15px;font-weight:700}
html[dir=rtl] .sheet h3{font-size:24px;font-weight:800}
html[dir=rtl] .item .nm{font-size:15px}
html[dir=rtl] .search input{padding:12px 16px 12px 44px}
html[dir=rtl] .search svg{right:auto;left:16px}
html[dir=rtl] .back svg{transform:scaleX(-1)}
html[dir=rtl] .close{right:auto;left:12px}
html[dir=rtl] .nm{text-align:right}
html[dir=rtl] .nm .ar,html[dir=rtl] .sheet .ar{text-align:right}
footer .lg{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;color:var(--rust);font-size:11px;margin-bottom:4px}

/* ---- WhatsApp ordering ---- */
.addrow{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0 4px}
.add{background:var(--rust);color:#fff;border-radius:999px;padding:11px 18px;font-weight:700;display:inline-flex;gap:8px;align-items:center;box-shadow:var(--shadow);transition:transform .15s}
.add:active{transform:scale(.97)}.add small{font-weight:600;opacity:.85}
.add.alt{background:var(--cream-2);color:var(--ink)}
.cartbar{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 12px);z-index:40;background:#1f7a45;color:#fff;border-radius:999px;padding:12px 16px 12px 20px;display:flex;align-items:center;gap:12px;box-shadow:0 10px 30px rgba(0,0,0,.25);font-weight:700;animation:up .25s ease-out;max-width:560px;margin:0 auto}
body:has(.sheet-bg) .cartbar{display:none}
main.wrap{padding-bottom:90px}
.cartbar .n{background:rgba(255,255,255,.2);border-radius:999px;padding:2px 10px;font-size:13px}
.cartbar .t{flex:1}.cartbar .go{display:flex;align-items:center;gap:8px}
.cartbar svg{width:22px;height:22px;fill:#fff}
.cart .line{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.cart .line .nm{flex:1;font-weight:700}.cart .line .nm small{display:block;font-weight:600;color:var(--ink-2)}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:50%;background:var(--cream-2);font-weight:800;font-size:18px;line-height:1}.qty b{min-width:18px;text-align:center}
.cart .total{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:14px 0 6px}
.cart .opts{display:flex;gap:8px;margin:10px 0}.cart .opts button{flex:1;padding:10px;border-radius:12px;background:var(--cream-2);font-weight:700}.cart .opts button[aria-pressed=true]{background:var(--rust);color:#fff}
.cart .wa{display:flex;justify-content:center;align-items:center;gap:10px;background:#1f7a45;color:#fff;border-radius:999px;padding:14px;font-weight:800;font-size:16px;text-decoration:none;margin-top:8px}
.cart .wa svg{width:22px;height:22px;fill:#fff}
.cart .hint{font-size:12px;color:var(--ink-2);text-align:center;margin-top:10px}
.cart .clear{display:block;margin:6px auto 0;font-size:13px;color:var(--ink-2);text-decoration:underline}
</style>

</head>

const $ = s => document.querySelector(s);
const app = $('#app');
const esc = s => String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let state = {group:0, cat:null, q:''};
let L='en'; try{ L = localStorage.getItem('lang')==='ar'?'ar':'en'; }catch(e){}
const UI = MENU.ui;
const T = (en,ar)=> L==='ar'?ar:en;
const nm = it => L==='ar' && it.ar ? it.ar : it.name;
const alt = it => L==='ar' ? it.name : (it.ar||'');
const catName = c => L==='ar' ? (MENU.cats_ar[c]||c) : c;
const grpName = g => L==='ar' ? g.ar : g.name;
const SR = ()=> L==='ar' ? UI.sr : 'SR';
const priceStr = p => L==='ar' ? String(p).replace(/SR/g,UI.sr).replace(/7UP/g,UI['7UP']).replace(/Code Red/g,UI['Code Red']).replace(/Red Bull/g,UI['Red Bull']) : p;
function applyLang(){
  document.documentElement.lang = L==='ar'?'ar':'en';
  document.documentElement.dir = L==='ar'?'rtl':'ltr';
  $('#b1').textContent = L==='ar'?'آرش فيو':'Arch View';
  $('#b2').textContent = L==='ar'?'مطعم وكافيه':'Restaurant & Cafe';
  $('#b3').textContent = L==='ar'?'Arch View Restaurant & Cafe':'مطعم وكافيه آرش فيو';
  $('#lang').innerHTML = L==='ar'?'English':'<b>العربية</b>';
  document.title = L==='ar'?'قائمة مطعم وكافيه آرش فيو':'Arch View Restaurant & Cafe Menu';
}
const byCat = {}; MENU.items.forEach((it,i)=>{it.id=i;(byCat[it.cat]=byCat[it.cat]||[]).push(it)});
const groupOf = c => MENU.groups.find(g=>g.cats.includes(c));

function priceHtml(p){
  if(typeof p==='number') return `<span class="price">${SR()} ${p}</span>`;
  const min=Math.min(...[...String(p).matchAll(/SR\s*(\d+)/g)].map(x=>+x[1]));
  return `<span class="price">${T('from','ابتداءً من')} ${SR()} ${min}</span>`;
}
function itemCard(it){
  return `<button class="item" data-item="${it.id}" aria-label="${esc(it.name)}">
    <div class="ph">${it.img?`<img src="${it.img}" alt="${esc(it.name)}" loading="lazy">`:`<span class="noimg">${it.icon||'🍽️'}</span>`}</div>
    <div class="txt"><div class="nm">${esc(nm(it))}${alt(it)?`<span class="ar" dir="${L==='ar'?'ltr':'rtl'}">${esc(alt(it))}</span>`:''}</div>
    <div class="row">${priceHtml(it.price)}${it.kcal!=null?`<span class="kcal">${it.kcal} ${T('kcal',UI.kcal)}</span>`:''}</div></div></button>`;
}
function searchBox(){
  return `<div class="search"><input id="q" type="search" placeholder="${T('Search the menu… e.g. lotus, shrimp, latte',UI.search)}" value="${esc(state.q)}" autocomplete="off">
  <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4" stroke-linecap="round"/></svg></div>`;
}
function renderHome(){
  const g = MENU.groups[state.group];
  const tabs = MENU.groups.map((gr,i)=>`<button class="tab" role="tab" aria-selected="${i===state.group}" data-group="${i}">${gr.icon} ${esc(grpName(gr))} <span class="n">${gr.cats.reduce((a,c)=>a+byCat[c].length,0)}</span></button>`).join('');
  const cats = g.cats.map(c=>{const items=byCat[c];const cover=items.find(i=>i.img);
    return `<button class="cat" data-cat="${esc(c)}">${cover?`<img src="${cover.img}" alt="">`:''}<div class="lbl">${esc(catName(c))}<small>${items.length} ${T('items',UI.items)}</small></div></button>`}).join('');
  app.innerHTML = searchBox()+`<div class="tabs" role="tablist">${tabs}</div><h2 class="sec">${esc(grpName(g))}</h2><div class="cats">${cats}</div>
  <footer><div class="lg">${T('Arch View Restaurant &amp; Cafe',UI.brand)}</div>${T('Prices in Saudi Riyals · Calories are approximate',UI.footer)}</footer>`;
}
function renderCat(){
  const items = byCat[state.cat]; const g=groupOf(state.cat);
  app.innerHTML = `<div class="topbar"><button class="back" data-back aria-label="Back"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <h2>${esc(catName(state.cat))}<small>${esc(grpName(g))} · ${items.length} ${T('items',UI.items)}</small></h2></div><div class="items">${items.map(itemCard).join('')}</div>`;
}
function renderSearch(){
  const q=state.q.trim().toLowerCase();
  const hits = MENU.items.filter(i=>i.name.toLowerCase().includes(q)||(i.ar||'').includes(q)||i.cat.toLowerCase().includes(q)||(MENU.cats_ar[i.cat]||'').includes(q));
  app.innerHTML = searchBox()+`<h2 class="sec">${hits.length} ${L==='ar'?UI.results:('result'+(hits.length===1?'':'s')+' for')} “${esc(state.q)}”</h2>`+
   (hits.length?`<div class="items">${hits.map(itemCard).join('')}</div>`:`<div class="empty">${T('Nothing matched. Try another word, or clear the search to browse by category.',UI.noresults)}</div>`);
  const inp=$('#q'); inp.focus(); inp.setSelectionRange(inp.value.length,inp.value.length);
}
function render(){
  if(state.cat) renderCat(); else if(state.q.trim()) renderSearch(); else renderHome();
  window.scrollTo({top:0});
}
function openItem(it){
  const old=$('.sheet-bg'); if(old) old.remove();
  const d=document.createElement('div'); d.className='sheet-bg';
  d.innerHTML=`<div class="sheet" role="dialog" aria-modal="true" aria-label="${esc(it.name)}"><div class="phwrap"><div class="ph">${it.img?`<img src="${it.img}" alt="${esc(it.name)}">`:`<span class="noimg" style="font-size:80px">${it.icon||'🍽️'}</span>`}</div>
   <button class="close" data-close aria-label="Close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/></svg></button></div>
   <div class="body"><h3>${esc(nm(it))}</h3>${alt(it)?`<p class="ar" dir="${L==='ar'?'ltr':'rtl'}">${esc(alt(it))}</p>`:''}
   <div class="meta">${typeof it.price==='number'?`<span class="chip p">${SR()} ${it.price}</span>`:esc(priceStr(it.price)).split(' · ').map(p=>`<span class="chip p">${p}</span>`).join(' ')}${it.kcal!=null?`<span class="chip k">${it.kcal} ${T('kcal',UI.kcal)}</span>`:''}</div>
   ${addButtons(it)}${it.desc?`<p class="desc">${esc(L==='ar'&&it.desc_ar?it.desc_ar:it.desc)}</p>`:''}<p class="catlink">${esc(catName(it.cat))}</p></div></div>`;
  document.body.appendChild(d); document.body.style.overflow='hidden';
  d.querySelector('[data-close]').focus();
}
function addButtons(it){return `<div class="addrow">${variants(it).map((v,i)=>`<button class="add ${i?'alt':''}" data-add="${it.id}" data-v="${i}">+ ${T('Add','أضف')}${v.label?` <small>${esc(priceStr(v.label))}</small>`:''} · ${SR()} ${v.price}</button>`).join('')}</div>`;}
function closeSheet(){const s=$('.sheet-bg'); if(s){s.remove();document.body.style.overflow='';}}
document.addEventListener('click',e=>{
  const t=e.target;
  if(t.closest('[data-close]')||(t.classList&&t.classList.contains('sheet-bg'))){closeSheet();return;}
  const it=t.closest('[data-item]'); if(it){openItem(MENU.items[+it.dataset.item]);return;}
  const c=t.closest('[data-cat]'); if(c){state.cat=c.dataset.cat;state.q='';render();return;}
  const b=t.closest('[data-back]'); if(b){state.cat=null;render();return;}
  const g=t.closest('[data-group]'); if(g){state.group=+g.dataset.group;render();return;}
  if(t.closest('#lang')){ L = L==='ar'?'en':'ar'; try{localStorage.setItem('lang',L);}catch(e){} applyLang(); render(); return; }
});
document.addEventListener('input',e=>{ if(e.target.id==='q'){state.q=e.target.value; state.cat=null; if(!state.q.trim()){render();} else renderSearch();} });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ if($('.sheet-bg')) closeSheet(); else if(state.cat){state.cat=null;render();} } });
applyLang(); render();

function variants(it){ if(typeof it.price==='number') return [{key:'',label:'',price:it.price}];
  return [...String(it.price).matchAll(/([A-Za-z0-9 ]+?) SR (\d+)/g)].map((m,i)=>({key:'abc'[i],label:m[1].trim(),price:+m[2]})); }
function addToCart(it,v){const key=it.id+v.key;const ex=cart.find(l=>l.key===key);if(ex)ex.qty++;else cart.push({key,id:it.id,vkey:v.key,name:it.name+(v.label?' ('+v.label+')':''),ar:(it.ar||'')+(v.label?' ('+(priceStr(v.label))+')':''),price:v.price,qty:1});saveCart();closeSheet();}
function cartCount(){return cart.reduce((a,l)=>a+l.qty,0);} function cartTotal(){return cart.reduce((a,l)=>a+l.qty*l.price,0);}
function renderCartBar(){let bar=$('.cartbar');if(!cart.length){if(bar)bar.remove();return;}
  if(!bar){bar=document.createElement('button');bar.className='cartbar';bar.dataset.cart='1';document.body.appendChild(bar);}
  bar.innerHTML=`<span class="n">${cartCount()}</span><span class="t">${T('Your order','طلبك')} · ${SR()} ${cartTotal()}</span><span class="go">${T('Order on WhatsApp','اطلب عبر واتساب')} ${waIcon()}</span>`;}
function waIcon(){return '<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2a8.2 8.2 0 0 1-4.2-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.6.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.3-.4.7-1.3.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.8 12 12 0 0 0 4.6 4c1.7.7 2.3.8 3.1.7a2.6 2.6 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.2c0-.2-.2-.3-.5-.4z"/></svg>';}
function orderCode(){const t=Date.now().toString(36).toUpperCase().slice(-4);const r=Math.floor(Math.random()*36).toString(36).toUpperCase();return 'A'+t+r;}
function openCart(){
  const old=$('.sheet-bg'); if(old) old.remove();
  const code=orderCode();
  const d=document.createElement('div'); d.className='sheet-bg';
  const lines=cart.map(l=>`<div class="line"><div class="nm">${esc(L==='ar'&&l.ar?l.ar:l.name)}<small>${SR()} ${l.price}</small></div><div class="qty"><button data-q="${l.key}" data-d="-1" aria-label="less">−</button><b>${l.qty}</b><button data-q="${l.key}" data-d="1" aria-label="more">+</button></div></div>`).join('');
  const typeTxt=otype==='D'?T('Delivery','توصيل'):T('Pickup','استلام');
  const msg=[`*Arch View – ${T('Order','طلب')} #${code}*`,typeTxt,'',...cart.map(l=>`${l.qty}× ${l.name}${L==='ar'&&l.ar?' – '+l.ar:''} – SR ${l.qty*l.price}`),'',`*${T('Total','الإجمالي')}: SR ${cartTotal()}*`,'',otype==='D'?T('Delivery address: ','عنوان التوصيل: '):'',`_staff: ${BACKOFFICE}#o-${code}-${otype}-${cart.map(l=>l.id+l.vkey+'x'+l.qty).join('-')}_`].filter(x=>x!==undefined).join('\n');
  const href=`https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}`;
  d.innerHTML=`<div class="sheet cart" role="dialog" aria-modal="true" aria-label="Your order"><div class="body"><h3>${T('Your order','طلبك')} <small style="font-weight:600;color:var(--ink-2)">#${code}</small></h3>
   ${lines}<div class="total"><span>${T('Total','الإجمالي')}</span><span>${SR()} ${cartTotal()}</span></div>
   <div class="opts"><button data-type="P" aria-pressed="${otype==='P'}">${T('Pickup','استلام')}</button><button data-type="D" aria-pressed="${otype==='D'}">${T('Delivery','توصيل')}</button></div>
   <a class="wa" href="${href}" target="_blank" rel="noopener" data-send>${waIcon()} ${T('Send order on WhatsApp','أرسل الطلب عبر واتساب')}</a>
   <p class="hint">${T('WhatsApp opens with your order ready to send to 0554312474. We confirm and prepare it right away.','سيفتح واتساب وطلبك جاهز للإرسال إلى 0554312474. سنؤكده ونجهزه فوراً.')}</p>
   <button class="clear" data-clear>${T('Clear order','مسح الطلب')}</button></div></div>`;
  document.body.appendChild(d); document.body.style.overflow='hidden';
}
document.addEventListener('click',e=>{
  const t=e.target;
  const a=t.closest('[data-add]'); if(a){const it=MENU.items[+a.dataset.add];const v=variants(it)[+a.dataset.v];addToCart(it,v);return;}
  if(t.closest('[data-cart]')){openCart();return;}
  const q=t.closest('[data-q]'); if(q){const l=cart.find(x=>x.key===q.dataset.q);if(l){l.qty+=+q.dataset.d;if(l.qty<=0)cart=cart.filter(x=>x!==l);}saveCart();if(cart.length)openCart();else closeSheet();return;}
  const ty=t.closest('[data-type]'); if(ty){otype=ty.dataset.type;openCart();return;}
  if(t.closest('[data-clear]')){cart=[];saveCart();closeSheet();return;}
  if(t.closest('[data-send]')){setTimeout(()=>{cart=[];saveCart();closeSheet();},800);}
},true);
renderCartBar();
</script>

</body>
</html>

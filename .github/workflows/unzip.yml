name: Unzip menu update
on:
  push:
    paths: ['*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract and commit
        run: |
          for z in *.zip; do [ -f "$z" ] && unzip -o "$z" -x '__MACOSX/*' && rm -f "$z"; done
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A
          git commit -m "Unpack menu update" || exit 0
          git push
